<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>musie — versions</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      // Cards printed before the player moved point at this page. Send them on
      // before anything else renders, unless this is the OAuth redirect coming
      // back with ?code=.
      (() => {
        const params = new URLSearchParams(window.location.search);
        const card = params.get("c");
        if (card && !params.get("code")) {
          window.location.replace(`listen.html?c=${encodeURIComponent(card)}`);
        }
      })();
    </script>
  </head>
  <body>
    <main>
      <header id="header"></header>
      <div id="auth"></div>
      <h2>Versions</h2>
      <div id="versions"></div>

      <hr class="rule" />
      <h2>Tools</h2>
      <div id="tools"></div>

      <hr class="rule" />
      <h2>Findings</h2>
      <div id="docs"></div>
    </main>
    <script type="module" src="src/home.js"></script>
  </body>
</html>
