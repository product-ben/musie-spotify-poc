<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>musie — embedded player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="index.html" title="All versions">musie<span>.</span></a>
        <div class="identity" id="chrome">
          <span class="status" id="mode">Press play to detect</span>
        </div>
      </header>
      <div id="view"></div>
    </main>

    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script type="module">
      import { CARDS, cardByCode } from "./src/tracks.js";
      import { sessionBadge } from "./src/chrome.js";

      // The shared session, carried across pages by localStorage.
      document.getElementById("chrome").append(sessionBadge());

      const view = document.getElementById("view");
      const mode = document.getElementById("mode");
      const code = new URLSearchParams(window.location.search).get("c");
      const card = cardByCode(code);

      const el = (tag, props = {}, children = []) => {
        const node = Object.assign(document.createElement(tag), props);
        for (const child of [].concat(children)) if (child) node.append(child);
        return node;
      };

      if (!card) {
        view.replaceChildren(
          el("div", { className: "notice" }, [
            el("p", {
              textContent: code
                ? `No card ${code} in the catalogue. Pick one below:`
                : "This link carries no card code. Pick one below:",
            }),
            el(
              "ul",
              { className: "cardlist" },
              CARDS.map((c) =>
                el("li", {}, [el("a", { href: `?c=${c.code}`, textContent: `Card ${c.code}` })]),
              ),
            ),
          ]),
        );
      } else {
        // The embed is a cross-origin iframe, so its insides can't be styled or
        // clicked from here. Instead the whole frame is blurred behind a veil
        // that carries our own button, and the Spotify IFrame API drives
        // playback — no dependence on where Spotify puts its controls.
        const target = el("div", {});
        const frame = el("div", { className: "frame" }, [target]);
        const toggle = el("button", { className: "big", textContent: "▶ Play", disabled: true });
        const veil = el("div", { className: "veil" }, [toggle]);
        const stage = el("div", { className: "stage" }, [frame, veil]);
        stage.dataset.revealed = "false";

        view.replaceChildren(
          el("h2", { textContent: `Card ${card.code}` }),
          stage,
          el("div", { className: "notice" }, [
            el("p", {
              textContent:
                "Press play to listen. Pause to reveal what it was. No Spotify account required.",
            }),
            el("p", {
              textContent:
                "The badge above reports which you got. It cannot be known before playback starts: the browser's Spotify session belongs to another origin and is unreadable from here, so the clip length is the only available signal.",
            }),
            el("p", {}, [
              document.createTextNode("To hear the full track, sign in at "),
              el("a", {
                href: "https://open.spotify.com",
                target: "_blank",
                rel: "noopener",
                textContent: "open.spotify.com",
              }),
              document.createTextNode(
                " with a Premium account, then come back and reload. The embed follows whatever Spotify session the browser has, not this app's own login.",
              ),
            ]),
            el("p", {}, [
              el("a", { href: "cards.html", textContent: "Printable cards →" }),
            ]),
          ]),
        );

        window.onSpotifyIframeApiReady = (IFrameAPI) => {
          IFrameAPI.createController(
            target,
            { uri: `spotify:track:${card.id}`, width: "100%", height: 352 },
            (controller) => {
              let hasPlayed = false;
              toggle.disabled = false;

              toggle.addEventListener("click", () => controller.togglePlay());

              controller.addListener("playback_update", ({ data }) => {
                // Spotify's own session is invisible from this origin, but the
                // clip length gives it away: an anonymous or free listener gets
                // a 30-second preview, a signed-in Premium one the whole track.
                if (data.duration > 0) {
                  const preview = data.duration <= 31000;
                  mode.textContent = preview
                    ? "30-second preview"
                    : `Full track — ${Math.round(data.duration / 1000)}s`;
                  mode.classList.toggle("ready", !preview);
                }

                if (!data.isPaused) hasPlayed = true;
                toggle.textContent = data.isPaused ? "▶ Play" : "⏸ Pause";

                // Revealed only once it has played and then been paused, so the
                // cover art stays hidden for as long as it is playing.
                if (hasPlayed && data.isPaused) stage.dataset.revealed = "true";
              });
            },
          );
        };
      }
    </script>
  </body>
</html>
