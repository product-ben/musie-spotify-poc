<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>musie — listen (self-hosted)</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Two full-screen panes: controls first, the embed a deliberate swipe
         away. The widget itself is untouched — full size, nothing over it,
         reachable by an ordinary scroll. */
      html {
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
      }
      body { padding: 0; }

      .pane {
        display: flex;
        flex-direction: column;
        scroll-snap-align: start;
        padding: 20px 16px;
        min-height: 100vh;
      }
      /* The extra 24px is slack: rounding or an unusual toolbar must not let
         the top edge of the widget creep into the first view. */
      .pane.hero { min-height: calc(100vh + 24px); }

      @supports (height: 100lvh) {
        .pane { min-height: 100lvh; }
        /* lvh is the *largest* viewport — the address bar collapsing can only
           ever shrink what is visible, never reveal what is below. */
        .pane.hero { min-height: calc(100lvh + 24px); }
      }

      .pane-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .pane-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
      .pane-mid .code { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }

      .cue { border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; padding: 12px; cursor: pointer; }
      .cue:hover { color: var(--text); filter: none; }
      .cue span { display: block; font-size: 20px; line-height: 1; margin-top: 6px; }
      .cue.up span { margin: 0 0 6px; }

      /* Pinned to the top edge while the player pane is in view. The pane
         reserves room for it below, so it never comes to rest over the
         widget — covering the embed is the one thing the terms forbid. */
      .backtop {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        padding: 10px 20px 14px;
        background: var(--bg);
        border-radius: 0 0 14px 14px;
      }
      .backtop[hidden] { display: none; }

      .gate .pane-mid { gap: 28px; }
      .gate-text {
        margin: 0;
        max-width: 20ch;
        font-size: clamp(24px, 5.2vw, 40px);
        line-height: 1.22;
        font-weight: 600;
        color: var(--text);
      }
      .gate-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

      .reveal-pane {
        max-width: 560px;
        margin: 0 auto;
        width: 100%;
        justify-content: center;
        padding-top: 84px;
      }
      .reveal-pane h2 { margin-top: 0; }
      .reveal-pane iframe { display: block; width: 100%; border: 0; border-radius: 12px; }
    </style>
  </head>
  <body>
    <section class="pane hero">
      <div class="pane-top">
        <a class="brand" href="index.html" title="All versions">musie <span>music streaming poc</span></a>
        <div class="identity" id="chrome">
          <span class="status ready" id="mode">Self-hosted — full length</span>
        </div>
      </div>
      <div class="pane-mid" id="controls"></div>
      <button class="cue" id="cue" hidden>Scroll to see the player<span>↓</span></button>
    </section>

    <section class="pane gate" id="gate">
      <div class="pane-mid">
        <p class="gate-text">
          For the exercise, it would be better to not get influenced by the
          track name and cover
        </p>
        <div class="gate-actions">
          <button class="big" id="back">Continue exercise, back up</button>
          <button class="big ghost" id="down">Scroll down to player</button>
        </div>
      </div>
    </section>

    <section class="pane reveal-pane" id="reveal"></section>

    <script type="module">
      import { CARDS, cardByCode } from "./src/tracks.js";

      const el = (tag, props = {}, children = []) => {
        const node = Object.assign(document.createElement(tag), props);
        for (const child of [].concat(children)) if (child) node.append(child);
        return node;
      };

      const controls = document.getElementById("controls");
      const revealPane = document.getElementById("reveal");
      const mode = document.getElementById("mode");
      const cue = document.getElementById("cue");
      const hero = document.querySelector(".hero");
      const gate = document.getElementById("gate");

      const code = new URLSearchParams(window.location.search).get("c");
      const card = cardByCode(code);

      if (!card?.audio) {
        mode.hidden = true;
        controls.replaceChildren(
          el("div", { className: "notice" }, [
            el("p", {
              textContent: card
                ? `Card ${card.code} has no self-hosted audio yet. Pick another:`
                : code
                  ? `No card ${code} in the catalogue. Pick one below:`
                  : "This link carries no card code. Pick one below:",
            }),
            el(
              "ul",
              { className: "cardlist" },
              CARDS.filter((c) => c.audio).map((c) =>
                el("li", {}, [el("a", { href: `?c=${c.code}`, textContent: `Card ${c.code}` })]),
              ),
            ),
          ]),
        );
      } else {
        // One audio element, living in the reveal pane where the Spotify
        // widget sits in v0.3.2, driven by the button on the first screen.
        const audio = el("audio", {
          src: card.audio.src,
          controls: true,
          preload: "metadata",
        });

        const toggle = el("button", { className: "big", textContent: "▶ Play" });
        controls.replaceChildren(
          el("div", { className: "code", textContent: `Card ${card.code}` }),
          toggle,
        );

        const up = el("button", { className: "cue up backtop", hidden: true }, [
          el("span", { textContent: "↑" }),
          document.createTextNode("Scroll up to exercise"),
        ]);
        up.addEventListener("click", () => hero.scrollIntoView({ behavior: "smooth" }));
        document.body.append(up);

        new IntersectionObserver(
          ([entry]) => {
            up.hidden = !entry.isIntersecting;
          },
          { threshold: 0.5 },
        ).observe(revealPane);

        revealPane.replaceChildren(
          el("h2", { textContent: "The track" }),
          el("div", { className: "card-title", textContent: card.audio.title }),
          el("p", {
            style: "color: var(--muted); margin: 0 0 16px",
            textContent: card.audio.artist,
          }),
          audio,
          el("p", {
            style: "color: var(--muted); font-size: 13px; margin-top: 16px",
            textContent: "Served from this site. No account, no third party, full length.",
          }),
        );

        toggle.addEventListener("click", () => {
          if (audio.ended) {
            audio.currentTime = 0;
          }
          if (audio.paused) audio.play();
          else audio.pause();
        });

        const paint = () => {
          toggle.textContent = audio.ended
            ? "↻ Restart"
            : audio.paused
              ? "▶ Play"
              : "⏸ Pause";
        };
        for (const event of ["play", "pause", "ended"]) {
          audio.addEventListener(event, paint);
        }

        audio.addEventListener("loadedmetadata", () => {
          mode.textContent = `Self-hosted — ${Math.round(audio.duration)}s`;
        });
        audio.addEventListener("error", () => {
          mode.textContent = "Audio failed to load";
          mode.classList.remove("ready");
        });

        cue.hidden = false;
        cue.addEventListener("click", () => gate.scrollIntoView({ behavior: "smooth" }));
        document
          .getElementById("back")
          .addEventListener("click", () => hero.scrollIntoView({ behavior: "smooth" }));
        document
          .getElementById("down")
          .addEventListener("click", () =>
            revealPane.scrollIntoView({ behavior: "smooth" }),
          );
      }
    </script>
  </body>
</html>
